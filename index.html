<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Draft Podcast | 入口門戶 - 探索 Jesper 與 Vivi 的世界</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="portal-body">
    <main class="portal">
        <div class="portal__logo">
            <h1>NO <span>DRAFT</span></h1>
            <p class="portal__subtitle">這裡應該要是首頁的</p>
            <div class="portal__intro">
                <p>歡迎來到「不草稿」數位門戶。這裡沒有預設的結局，只有最純粹的對話。</p>
                <p>探索兩位不同靈魂的碰撞：左側是科技視野，右側是生活感悟。</p>
            </div>
        </div>

        <div class="split-screen">
            <!-- JESPER SIDE -->
            <a href="jesper.html" class="split jesper" id="jesper-side">
                <div class="split__content">
                    <img src="jesper.png" alt="Jesper" class="split__avatar">
                    <h2 class="split__title">Jesper</h2>
                    <p class="split__desc">科技、創意與數位未來的探索者</p>
                    <span class="split__btn">進入空間 →</span>
                </div>
            </a>

            <!-- VIVI SIDE -->
            <a href="vivi.html" class="split vivi" id="vivi-side">
                <div class="split__content">
                    <img src="vivi.png" alt="Vivi" class="split__avatar">
                    <h2 class="split__title">Vivi</h2>
                    <p class="split__desc">生活、感性與人文對話的傾聽者</p>
                    <span class="split__btn">進入空間 →</span>
                </div>
            </a>
        </div>
    </main>

    <div class="portal__footer">
        <p>No Draft Podcast ©️ 2026. Real Talk, No Drafts.</p>
    </div>

    <script>
        const left = document.getElementById('jesper-side');
        const right = document.getElementById('vivi-side');

        left.addEventListener('mouseenter', () => {
            left.style.flex = "2";
            right.style.flex = "0.5";
        });

        left.addEventListener('mouseleave', () => {
            left.style.flex = "1";
            right.style.flex = "1";
        });

        right.addEventListener('mouseenter', () => {
            right.style.flex = "2";
            left.style.flex = "0.5";
        });

        right.addEventListener('mouseleave', () => {
            right.style.flex = "1";
            left.style.flex = "1";
        });
    </script>
</body>
</html>
